<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oru Kutty Sorry 💜</title>
<style>
  :root { --sky:#8edcff; --blue:#b9ecff; --purple:#b59aff; --deep:#7654c8; --ink:#33234e; }
  * { box-sizing:border-box }
  body {
    margin:0; min-height:100vh; overflow:hidden; color:var(--ink);
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    background:linear-gradient(135deg,#8edcff 0%,#c3d7ff 48%,#b99aff 100%);
  }
  body:before, body:after {
    content:""; position:fixed; width:340px; height:340px; border-radius:50%;
    background:rgba(255,255,255,.22); filter:blur(2px); pointer-events:none;
  }
  body:before { top:-150px; left:-100px } body:after { bottom:-170px; right:-100px }
  .sparkle { position:fixed; color:#fff; opacity:.8; animation:twinkle 3s ease-in-out infinite; pointer-events:none }
  .s1{top:12%;left:12%}.s2{top:20%;right:13%;animation-delay:1s}.s3{bottom:15%;left:17%;animation-delay:1.7s}.s4{bottom:22%;right:18%;animation-delay:.5s}
  @keyframes twinkle { 0%,100%{transform:scale(.7) rotate(0);opacity:.35}50%{transform:scale(1.25) rotate(25deg);opacity:1} }
  main { min-height:100vh; display:grid; place-items:center; padding:22px; position:relative; z-index:1 }
  .card {
    width:min(92vw,610px); min-height:570px; padding:clamp(26px,5vw,48px);
    border:1px solid rgba(255,255,255,.65); border-radius:32px;
    background:rgba(255,255,255,.72); box-shadow:0 24px 70px rgba(75,52,135,.18);
    backdrop-filter:blur(16px); text-align:center; display:flex; flex-direction:column;
    align-items:center; justify-content:center; animation:arrive .55s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes arrive { from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none} }
  .eyebrow { font-size:.78rem; letter-spacing:.2em; text-transform:uppercase; color:#8065b6; font-weight:800; margin-bottom:12px }
  h1 { font-size:clamp(2.1rem,7vw,3.7rem); line-height:1.12; margin:0 0 14px; color:#543b91; letter-spacing:-.04em }
  .sub { font-size:1.05rem; line-height:1.65; max-width:440px; color:#65577d; margin:0 auto 22px }
  .sticker { width:190px; height:175px; margin:4px auto 18px; position:relative; display:grid; place-items:center; overflow:hidden; border-radius:18px }\n  .sticker iframe { width:190px; height:175px; border:0; display:block; }
  .bear { width:112px;height:104px;position:relative; background:#fff0dc; border-radius:48% 48% 43% 43%; box-shadow:inset -8px -7px 0 #f5d8c2,0 12px 22px #7654c822; animation:bob 2.2s ease-in-out infinite }
  .ear { position:absolute; width:40px;height:40px; border-radius:50%; background:#fff0dc; top:-13px; z-index:-1 }
  .ear.left{left:0}.ear.right{right:0}
  .ear:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#f5b9c7}
  .eye { position:absolute; top:39px; width:7px;height:9px;border-radius:50%;background:#493a54 }
  .eye.left{left:32px}.eye.right{right:32px}
  .cheek { position:absolute;top:53px;width:17px;height:9px;border-radius:50%;background:#f5a8b5;opacity:.8 }
  .cheek.left{left:17px}.cheek.right{right:17px}
  .mouth { position:absolute;top:52px;left:51px;width:11px;height:8px;border-bottom:2px solid #493a54;border-radius:50% }
  .paw { position:absolute; width:34px;height:25px;background:#fff0dc;border-radius:50%;bottom:3px;z-index:2 }
  .paw.left{left:-12px;transform:rotate(28deg)}.paw.right{right:-12px;transform:rotate(-28deg)}
  .heart { position:absolute;color:#ff6d9a;font-size:34px;right:5px;top:3px;animation:float 2s ease-in-out infinite }
  .tear { position:absolute;color:#70cfff;font-size:19px;left:8px;top:56px;animation:tear 1.8s ease-in-out infinite }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)} }
  @keyframes float { 0%,100%{transform:translateY(0) scale(.9)}50%{transform:translateY(-12px) scale(1.12)} }
  @keyframes tear { 0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(10px);opacity:1} }
  .buttons { display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px;min-height:56px }
  button { border:0; border-radius:999px; padding:14px 30px; font-size:1rem; font-weight:800; cursor:pointer; transition:transform .18s,box-shadow .18s,filter .18s }
  button:hover { transform:translateY(-3px);filter:brightness(1.04) }
  button:focus-visible { outline:3px solid #5d45a5;outline-offset:4px }
  .yes { color:white;background:linear-gradient(100deg,#6fcdf5,#8965db);box-shadow:0 9px 20px #8065b644 }
  .no { color:#725b91;background:#f0eaff;box-shadow:0 6px 14px #8065b41c }
  .no.small { padding:10px 23px;font-size:.9rem }
  .tiny { color:#9a8ab0;font-size:.82rem;margin-top:22px }
  .final h1 {font-size:clamp(2rem,6vw,3.2rem)}
  .letter { max-width:470px; text-align:left; background:#ffffff9c; border:1px solid #fff; border-radius:22px; padding:22px 24px; line-height:1.75; color:#57476e; box-shadow:0 10px 25px #7654c812 }
  .signature {font-weight:800;color:#7654c8;text-align:center;margin-top:15px}
  .big-heart {font-size:58px;line-height:1;margin:4px 0 15px;animation:heartbeat 1.4s ease-in-out infinite}
  @keyframes heartbeat {0%,100%{transform:scale(1)}15%{transform:scale(1.16)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
  .restart {margin-top:18px;background:transparent;color:#927bb3;text-decoration:underline;padding:8px 12px;font-size:.86rem}
  @media(max-height:700px){.card{min-height:0;padding:24px}.sticker{height:130px;margin:0 auto 10px}.bear{transform:scale(.85)}.sub{margin-bottom:12px}}
</style>
</head>
<body>
<div class="sparkle s1">✦</div><div class="sparkle s2">✧</div><div class="sparkle s3">✦</div><div class="sparkle s4">✧</div>
<main>
  <section class="card" id="card" aria-live="polite">
    <div class="eyebrow">a tiny request from my heart</div>
    <h1>Mannipayaa?</h1>
    <p class="sub">I Will you forgive me? 🥺</p>
    <div class="sticker" aria-label="Sorry GIF"><iframe src="https://giphy.com/embed/DLCdj0kedeQLxi15iX" width="190" height="175" frameborder="0" allowfullscreen loading="lazy" title="Sorry GIF"></iframe></div>
    <div class="buttons">
      <button class="yes" onclick="goTo(4)">Yes 💗</button>
      <button class="no" onclick="goTo(2)">No 🙈</button>
    </div>
    <div class="tiny">No pressure. Just one honest sorry. 💜</div>
  </section>
</main>
<script>
const pages = {
  2: `
    <div class="eyebrow">okay… one more little plea</div>
    <h1>Avlothana, manika matiya? 🥺</h1>
    <p class="sub">Enna konjam paavam paathutu… indha sorry request ah consider pannuriya? 💜</p>
    <div class="sticker" aria-label="Pleading GIF"><iframe src="https://giphy.com/embed/fxU6WfJ8eembhmZBC6" width="190" height="175" frameborder="0" allowfullscreen loading="lazy" title="Pleading GIF"></iframe></div>
    <div class="buttons">
      <button class="yes" onclick="goTo(4)">Yes 🥹</button>
      <button class="no small" onclick="goTo(3)">No 🥺</button>
    </div>
    <div class="tiny">I know sorry mattum podhaadhu. I want to do better.</div>`,
  3: `
    <div class="eyebrow">last request, promise</div>
    <h1>Inime lam kenjitu iruka maten 😏</h1>
    <p class="sub">Straight ah kaal la vilundhu kekuren, manippiya? 🥺</p>
    <div class="sticker" aria-label="Bowing apology GIF"><iframe src="https://giphy.com/embed/tV1PCmfXeDRDpsw2c9" width="190" height="175" frameborder="0" allowfullscreen loading="lazy" title="Bowing apology GIF"></iframe></div>
    <div class="buttons"><button class="yes" onclick="goTo(4)">Okay, come here 💞</button></div>
    <div class="tiny">Whatever your answer, you deserve care and respect.</div>`,
  4: `
    <div class="eyebrow">from my heart, always</div>
    <div class="big-heart">💜</div>
    <h1 class="final">I'm truly sorry.</h1>
    <div class="letter">
      I know you have endured so much pain, and I know I neglected you when you needed love, care, and understanding from me. I won't make excuses for that. It was my fault, and you didn't deserve it.<br><br>
      I'm sorry for the times I made you feel alone, unheard and less important. You mean so much to me, and I hate that my actions didn't show it. I know words can't undo what happened, and I don't expect one “YES” is all it takes to fix everything.<br><br>
      I want to be a reason for that little smile on your face and not another reason for your tears. I'll try to show you through my actions, patiently, consistently, and without taking your love for granted ever again.<br><br>
      Thank you for comming into my life and making it more beautiful. I love you. ❤️
      <div class="signature">I love you, Na pranameyyy. 💗</div>
    </div>
    <button class="restart" onclick="goTo(1)">Read it again ↺</button>`
};
function goTo(n) {
  const card = document.getElementById('card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
  if (n === 1) {
    card.innerHTML = `
      <div class="eyebrow">a tiny request from my heart</div><h1>Mannipayaa?</h1>
      <p class="sub">I brought my tiniest, most apologetic face. Will you hear me out? 🥺</p>
      <div class="sticker"><iframe src="https://giphy.com/embed/DLCdj0kedeQLxi15iX" width="190" height="175" frameborder="0" allowfullscreen loading="lazy" title="Sorry GIF"></iframe></div>
      <div class="buttons"><button class="yes" onclick="goTo(4)">Yes 💗</button><button class="no" onclick="goTo(2)">No 🙈</button></div>
      <div class="tiny">No pressure. Just one honest sorry. 💜</div>`;
  } else card.innerHTML = pages[n];
}
</script>
</body>
</html>
